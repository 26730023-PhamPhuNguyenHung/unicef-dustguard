<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" style="background-color: #FDFBF7; font-family: 'Be Vietnam Pro', 'Segoe UI', system-ui, -apple-system, sans-serif;">
  <!-- Solid Background -->
  <rect width="1920" height="1080" fill="#FDFBF7"/>

  <!-- Left Accent Bar -->
  <rect x="0" y="0" width="24" height="1080" fill="#9F241F"/>

  <!-- Outer Border -->
  <rect x="36" y="36" width="1848" height="1008" fill="none" stroke="#D4CEBF" stroke-width="2"/>

  <!-- Top Ribbon -->
  <g transform="translate(80, 60)">
    <rect x="0" y="0" width="700" height="50" rx="12" fill="#9F241F"/>
    <text x="350" y="34" fill="#FFFFFF" font-size="22" font-weight="800" text-anchor="middle" letter-spacing="2">
      ★ UNICEF HACKATHON 2026 — VÒNG CHUNG KẾT ★
    </text>
  </g>

  <!-- Main Left Content Block (Width: 1100px) -->
  <g transform="translate(80, 150)">
    <!-- Shield Logo Small & Title Lockup -->
    <g transform="translate(0, 10)">
      <path d="M40 0 L80 20 L80 70 C80 110 40 135 40 135 C40 135 0 110 0 70 L0 20 Z" fill="#9F241F"/>
      <circle cx="40" cy="55" r="18" fill="#FFFFFF"/>
      <circle cx="40" cy="55" r="9" fill="#0D6F64"/>
      
      <text x="105" y="65" fill="#231B14" font-size="75" font-weight="900" letter-spacing="-1">DUSTGUARD VN</text>
      <rect x="105" y="85" width="620" height="38" rx="8" fill="#E6F4F1" stroke="#0D6F64" stroke-width="1.5"/>
      <text x="120" y="111" fill="#0D6F64" font-size="18" font-weight="800" letter-spacing="1">
        CIVIC TECH · GIÁM SÁT BỤI CÔNG TRÌNH · ĐÓNG VÒNG MINH BẠCH
      </text>
    </g>

    <!-- Big Catchy Headline -->
    <g transform="translate(0, 180)">
      <text x="0" y="80" fill="#231B14" font-size="52" font-weight="900">
        NỀN TẢNG CIVIC TECH
      </text>
      <text x="0" y="150" fill="#9F241F" font-size="52" font-weight="900">
        GIÁM SÁT &amp; ĐÓNG VÒNG BỤI ĐÔ THỊ
      </text>
      <text x="0" y="215" fill="#574F45" font-size="26" font-weight="600">
        Kết nối tín hiệu bụi hiện trường thành hồ sơ số SHA-256 có giá trị thực thi
      </text>
    </g>

    <!-- 4 Value Pill Badges -->
    <g transform="translate(0, 470)">
