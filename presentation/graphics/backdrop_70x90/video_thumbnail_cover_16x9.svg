      <rect x="0" y="0" width="530" height="90" rx="16" fill="#FFFFFF" stroke="#D4CEBF" stroke-width="2"/>
      <circle cx="50" cy="45" r="25" fill="#9F241F"/>
      <text x="50" y="53" fill="#FFFFFF" font-size="18" font-weight="800" text-anchor="middle">HASH</text>
      <text x="90" y="38" fill="#231B14" font-size="22" font-weight="800">Bảo Chứng SHA-256</text>
      <text x="90" y="68" fill="#574F45" font-size="18" font-weight="500">Chống sửa đổi · Web Crypto SSOT</text>

      <!-- Pill 2 -->
      <rect x="560" y="0" width="530" height="90" rx="16" fill="#FFFFFF" stroke="#D4CEBF" stroke-width="2"/>
      <circle cx="610" cy="45" r="25" fill="#0D6F64"/>
      <text x="610" y="53" fill="#FFFFFF" font-size="18" font-weight="800" text-anchor="middle">5S</text>
      <text x="650" y="38" fill="#231B14" font-size="22" font-weight="800">Chu Trình 5 Bước</text>
      <text x="650" y="68" fill="#574F45" font-size="18" font-weight="500">Phát hiện → Xử lý → Tái kiểm</text>

      <!-- Pill 3 -->
      <rect x="0" y="110" width="530" height="90" rx="16" fill="#FFFFFF" stroke="#D4CEBF" stroke-width="2"/>
      <circle cx="50" cy="155" r="25" fill="#B45309"/>
      <text x="50" y="163" fill="#FFFFFF" font-size="18" font-weight="800" text-anchor="middle">SLA</text>
      <text x="90" y="148" fill="#231B14" font-size="22" font-weight="800">Tái Kiểm 24h – 48h</text>
      <text x="90" y="178" fill="#574F45" font-size="18" font-weight="500">Ràng buộc trách nhiệm thực tế</text>

      <!-- Pill 4 -->
      <rect x="560" y="110" width="530" height="90" rx="16" fill="#FFFFFF" stroke="#D4CEBF" stroke-width="2"/>
      <circle cx="610" cy="155" r="25" fill="#1E7E4E"/>
      <text x="610" y="163" fill="#FFFFFF" font-size="18" font-weight="800" text-anchor="middle">0.5M</text>
      <text x="650" y="148" fill="#231B14" font-size="22" font-weight="800">Node IoT ≈ 0,5 Triệu</text>
      <text x="650" y="178" fill="#574F45" font-size="18" font-weight="500">ESP32 + Cảm biến mở giá rẻ</text>
    </g>

