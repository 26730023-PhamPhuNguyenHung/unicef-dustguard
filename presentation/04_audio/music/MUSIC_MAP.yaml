audio_ducking_rules:
  voice_active:
    bgm_volume_db: -18.0 # Giảm BGM khi có giọng đọc
    fade_in_ms: 150
    fade_out_ms: 400
  voice_pause:
    bgm_volume_db: -8.0 # Tăng BGM khi ngắt câu để đẩy chuyển cảnh
  climax_boost:
    bgm_volume_db: -5.0 # Tăng BGM ở 5 giây cuối kết video
