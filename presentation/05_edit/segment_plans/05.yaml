voice_text: 'Điểm mới của DustGuard không nằm ở việc tạo thêm một nơi để gửi phản
  ánh. Điều chúng tôi muốn giải quyết là khoảng trống sau khi phản ánh đã được gửi.
  Một tín hiệu ban đầu phải có cơ hội trở thành một hồ sơ. Một hồ sơ phải có bằng
  chứng. Một trường hợp phải có mức độ ưu tiên. Và quan trọng nhất: phải có thể biết
  nó đang được xử lý tới đâu.'
