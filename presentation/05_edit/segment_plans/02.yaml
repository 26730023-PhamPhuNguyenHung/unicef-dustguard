voice_text: 'Điều chúng tôi nhận ra là: vấn đề không phải chúng ta hoàn toàn không
  có dữ liệu. Người dân có phản ánh. Có hình ảnh. Có vị trí. Có thông tin công trình.
  Có hồ sơ kiểm tra. Và trong tương lai còn có thể có dữ liệu từ cảm biến. Nhưng những
  thông tin đó thường nằm ở nhiều nơi khác nhau. Và khi dữ liệu bị phân tán, điều
  khó nhất là biến nó thành một hành động có thứ tự ưu tiên.'
