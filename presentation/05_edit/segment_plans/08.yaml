voice_text: 'Chúng tôi cũng học được rằng một giải pháp môi trường không nên bắt đầu
  bằng một hạ tầng thật lớn. DustGuard có thể bắt đầu chỉ với dữ liệu đang có: phản
  ánh, hình ảnh, vị trí, checklist và hồ sơ. Một pilot có thể triển khai trong một
  cộng đồng nhỏ, một trường học hoặc một câu lạc bộ môi trường. Trong bốn đến tám
  tuần. Với hai mươi đến ba mươi người dùng thật. Và những chỉ số có thể đo được.'
