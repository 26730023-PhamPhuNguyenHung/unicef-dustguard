voice_text: Nếu cách tiếp cận này được kiểm chứng với bụi công trình, chúng tôi tin
  rằng cùng một lõi có thể tiếp tục được phát triển cho những vấn đề môi trường khác.
  Nước thải. Đốt rơm rạ. Thuốc bảo vệ thực vật. Tiếng ồn. Nhưng mỗi bước mở rộng đều
  phải bắt đầu lại bằng việc hiểu đúng người dùng, đúng dữ liệu và đúng quy trình
  thực tế.
