voice_text: Ở một thành phố đang phát triển, những công trường mới đồng nghĩa với
  những con đường mới, những ngôi nhà mới và những cơ hội mới. Nhưng cùng với sự phát
  triển đó, có một tác động rất dễ bị xem là nhỏ... cho đến khi nó trở thành vấn đề
  của cả một cộng đồng. Đó là bụi công trình.
