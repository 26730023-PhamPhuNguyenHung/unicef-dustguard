voice_text: 'Dust Risk Score không trả lời rằng một công trình có vi phạm hay không.
  Nó chỉ hỗ trợ một câu hỏi thực tế hơn: trong nhiều trường hợp đang tồn tại, trường
  hợp nào nên được xem xét trước, và vì sao? AI có thể phân loại, tóm tắt, tìm thông
  tin còn thiếu và hỗ trợ checklist. Nhưng AI không tự kết luận vi phạm. Không tự
  quyết định xử phạt. Và không thay thế cơ quan có thẩm quyền.'
