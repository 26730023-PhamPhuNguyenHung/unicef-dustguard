  quyết định hơn con người. Nó phải giúp con người có đủ thông tin để đưa ra quyết
  định tốt hơn. Vì vậy, chúng tôi thay đổi cách nhìn về AI, về điểm rủi ro và cả vai
  trò của IoT.
