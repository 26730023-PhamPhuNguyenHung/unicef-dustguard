; PlatformIO Project Configuration File for DustGuard IoT Node
; Target: ESP32 DevKit V1 + ASAIR APM2000 + OLED SSD1306
; Framework: Arduino

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Compiler options: Enable C++17, Warnings, Optimization
build_unflags = -std=gnu++11
build_flags = 
    -std=gnu++17
    -D CORE_DEBUG_LEVEL=3
    -D ARDUINOJSON_USE_LONG_LONG=1

; Pinned library dependencies for reproducible builds
lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit BusIO @ ^1.14.5
    bblanchon/ArduinoJson @ ^6.21.4
    Wire
    SPI
    WiFi
    HTTPClient
    WiFiClientSecure
