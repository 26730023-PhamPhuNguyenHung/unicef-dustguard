<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="OLED SSD1306 0.96 inch">
  <!-- DustGuard Native SVG: 0.96in OLED SSD1306 module, top-down product shot. CC0-1.0 -->
  <rect width="512" height="512" fill="#FDFBF7"/>
  <defs>
    <linearGradient id="pcb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B74C4"/>
      <stop offset="100%" stop-color="#2456A0"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1C1C1C"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#231b14" flood-opacity="0.18"/>
    </filter>
  </defs>
  <ellipse cx="256" cy="450" rx="130" ry="18" fill="#231b14" opacity="0.10"/>
  <g filter="url(#sh)" transform="translate(256 256) rotate(-18) translate(-256 -256)">
    <!-- PCB -->
    <rect x="126" y="150" width="260" height="230" rx="10" fill="url(#pcb)"/>
    <!-- corner holes -->
    <circle cx="148" cy="172" r="8" fill="#0D2144"/>
    <circle cx="148" cy="172" r="3.5" fill="#C9D2DE"/>
    <circle cx="364" cy="172" r="8" fill="#0D2144"/>
    <circle cx="364" cy="172" r="3.5" fill="#C9D2DE"/>
    <circle cx="148" cy="358" r="8" fill="#0D2144"/>
    <circle cx="148" cy="358" r="3.5" fill="#C9D2DE"/>
    <circle cx="364" cy="358" r="8" fill="#0D2144"/>
    <circle cx="364" cy="358" r="3.5" fill="#C9D2DE"/>
    <!-- OLED bezel -->
    <rect x="156" y="198" width="200" height="120" rx="4" fill="#0A0A0A"/>
    <!-- active area -->
    <rect x="168" y="210" width="176" height="96" rx="2" fill="url(#screen)"/>
    <!-- fake readout -->
    <g fill="#DDE8FF" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700">
      <text x="180" y="240">PM2.5</text>
      <text x="180" y="268" font-size="28">32</text>
      <text x="230" y="268" font-size="14" fill="#9BB0D8">ug/m3</text>
      <text x="180" y="292" font-size="12" fill="#7F98C4">WiFi OK  DG-01</text>
    </g>
    <!-- 4-pin header top -->
    <g>
      <rect x="188" y="132" width="14" height="28" rx="2" fill="#E4E8EE"/>
      <rect x="214" y="132" width="14" height="28" rx="2" fill="#E4E8EE"/>
      <rect x="240" y="132" width="14" height="28" rx="2" fill="#E4E8EE"/>
      <rect x="266" y="132" width="14" height="28" rx="2" fill="#E4E8EE"/>
      <rect x="191" y="118" width="8" height="18" rx="1" fill="#AAB3C0"/>
      <rect x="217" y="118" width="8" height="18" rx="1" fill="#AAB3C0"/>
      <rect x="243" y="118" width="8" height="18" rx="1" fill="#AAB3C0"/>
      <rect x="269" y="118" width="8" height="18" rx="1" fill="#AAB3C0"/>
    </g>
    <!-- tiny IC / passives -->
    <rect x="300" y="340" width="36" height="18" rx="2" fill="#1A1A1A"/>
    <rect x="170" y="348" width="12" height="6" rx="1" fill="#C9A227"/>
    <rect x="188" y="348" width="12" height="6" rx="1" fill="#C9A227"/>
  </g>
</svg>
