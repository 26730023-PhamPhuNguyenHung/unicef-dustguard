<?xml version="1.0" encoding="UTF-8"?>
<!-- Semi-circular priority gauge, value arc drawn at 87 / 100.
     The arc ramps teal -> amber so it reads as "how soon", not as a verdict;
     seal red is spent only on the 87 marker knob.
     Text-free on purpose: the score and its labels are typeset in Typst from
     content.yml so content.yml stays the single source of visible strings. -->
<svg viewBox="0 0 440 240" width="440" height="240" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="priority-ramp" x1="50" y1="0" x2="390" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0D6F64" />
      <stop offset="0.55" stop-color="#4F7F52" />
      <stop offset="1" stop-color="#B57200" />
    </linearGradient>
  </defs>

  <!-- track -->
  <path d="M 50 210 A 170 170 0 0 1 390 210"
        fill="none" stroke="#EBE6DF" stroke-width="30" stroke-linecap="round" />

  <!-- value arc = 87 % of the half circle -->
  <path d="M 50 210 A 170 170 0 0 1 376.03 142.48"
        fill="none" stroke="url(#priority-ramp)" stroke-width="30" stroke-linecap="round" />

  <!-- value knob: the only seal red in the panel -->
  <circle cx="376.03" cy="142.48" r="21" fill="#FDFBF7" stroke="#9f0d0c" stroke-width="9" />

  <!-- scale ticks at 0 / 50 / 100 -->
  <g stroke="#8C827A" stroke-width="4" stroke-linecap="round">
    <path d="M 30 210 L 17 210" />
    <path d="M 220 20 L 220 7" />
    <path d="M 410 210 L 423 210" />
  </g>
</svg>
