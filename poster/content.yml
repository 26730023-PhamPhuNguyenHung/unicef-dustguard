    stores:
      - name: "D1"
        detail: "Hồ sơ & lịch sử"
      - name: "R2"
        detail: "Ảnh & minh chứng"
  prototype_label: "NGUYÊN MẪU & KIỂM CHỨNG KỸ THUẬT"
  prototype_note: "Số liệu demo/seed không được gọi là kết quả thử nghiệm thực địa."
  verification:
    - "Nguyên mẫu hoạt động"
    - "Kiểm chứng tự động"
    - "Lưu vết thao tác"
    - "Không cần quản trị server riêng"
  iot:
    title: "NGUỒN DỮ LIỆU BỔ SUNG"
    card_title: "Phần cứng chính"
    chip_icon: "assets/iot/icon-chip.svg"
    wallet_icon: "assets/iot/icon-wallet.svg"
    components:
      - name: "APM2000"
        detail: "Cảm biến bụi laser đo PM1.0, PM2.5, PM10"
        photo: "assets/iot/apm2000.png"
      - name: "ESP32 DevKit"
        detail: "Vi điều khiển chính, kết nối Wi-Fi"
        photo: "assets/iot/esp32.png"
      - name: "OLED SSD1306"
        detail: "Hiển thị thông số tại thiết bị"
        photo: "assets/iot/oled-ssd1306.png"
    cost_prefix: "Chi phí dự kiến: khoảng"
    cost_value: "420.000 – 500.000 VNĐ / node"
    # Right panel fills the former empty bottom-right of zone 07.
    role_title: "Vai trò trên hệ thống"
    role_points:
      - "Tín hiệu môi trường bổ sung — không bắt buộc"
      - "Node → Wi-Fi → Cloudflare Worker → hồ sơ"
      - "Không có IoT: điểm ưu tiên vẫn chạy đủ"
    role_flow:
      - "Cảm biến"
      - "ESP32"
      - "Wi-Fi"
      - "DustGuard"
    pm_chips:
      - "PM1.0"
      - "PM2.5"
      - "PM10"

